# Publie une version de « Mes outils » : à chaque étiquette vX.Y.Z poussée sur
# GitHub, construit Mes-outils-Setup.exe (Windows) et
# Mes-outils-x86_64.AppImage (Linux), puis les dépose ensemble dans la même
# page Releases.
#   git tag v1.3.0 && git push origin v1.3.0
name: Version

on:
  push:
    tags: ["v*"]
    # Branche « linux » : construit les deux fichiers sans rien publier (essais).
    branches: ["linux"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installateur:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliothèques
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.22.3

      - name: Étiquette = version du code
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path "outil\config.py" -Pattern '^VERSION = "([\d.]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "L'étiquette ${{ github.ref_name }} ne correspond pas à VERSION = $version (outil\config.py)" }

      - name: Tests
        # Certains tests touchent le bureau Windows (presse-papiers, coffre) :
        # ils peuvent échouer sur une machine sans session ; ils tournent avant
        # chaque envoi sur le PC du développeur.
        continue-on-error: true
        run: python -m unittest discover -s tests

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Construction
        shell: pwsh
        run: ./packaging/construire.ps1 -Python python

      - uses: actions/upload-artifact@v4
        with:
          name: Mes-outils-Setup
          path: dist/Mes-outils-Setup.exe

  appimage:
    # Ubuntu 22.04 : glibc plus ancienne que celle d'Ubuntu 24.04, l'AppImage
    # marche donc sur les deux.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paquets du système
        # libtk8.6 : tkinter de Python ; libfuse2 : appimagetool ;
        # libx11 et libxext : la forme ronde de la bulle.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtk8.6 tk-dev libfuse2 libx11-6 libxext6

      - name: Bibliothèques
        run: python -m pip install --disable-pip-version-check -r requirements.txt pyinstaller==6.22.3

      - name: Étiquette = version du code
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^VERSION = "\([0-9.]*\)".*/\1/p' outil/config.py)"
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "L'étiquette ${{ github.ref_name }} ne correspond pas à VERSION = $version (outil/config.py)"
            exit 1
          fi

      - name: Tests
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests

      - name: Construction
        env:
          PYTHON: python
        run: bash packaging/construire_linux.sh

      - name: Contenu de l'AppImage
        run: |
          ./dist/Mes-outils-x86_64.AppImage --appimage-extract >/dev/null
          test -x "squashfs-root/AppRun"
          test -x "squashfs-root/usr/lib/mes-outils/Mes outils"
          test -f "squashfs-root/usr/lib/mes-outils/_internal/mes_outils.png"
          test -f "squashfs-root/usr/lib/mes-outils/_internal/modules.json"
          rm -rf squashfs-root

      - name: Démarrage de l'AppImage (écran virtuel)
        # La bulle doit démarrer et le tableau de bord répondre, sans erreur.
        run: |
          sudo apt-get install -y --no-install-recommends xvfb
          export MES_OUTILS_DONNEES="$RUNNER_TEMP/essai-mes-outils"
          mkdir -p "$MES_OUTILS_DONNEES"
          xvfb-run -a ./dist/Mes-outils-x86_64.AppImage --appimage-extract-and-run > demarrage.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8760/; then echo "Tableau de bord : OK"; break; fi
            sleep 1
          done
          sleep 3
          cat demarrage.log
          cat "$MES_OUTILS_DONNEES/hub.log" 2>/dev/null || true
          if grep -q "Traceback" demarrage.log; then echo "::error::Erreur au démarrage de l'AppImage : $(grep -A3 -m1 Error demarrage.log | tr '\n' ' ')"; exit 1; fi
          curl -sf -o /dev/null http://127.0.0.1:8760/ || { echo "::error::Le tableau de bord ne répond pas"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Mes-outils-AppImage
          path: dist/Mes-outils-x86_64.AppImage

  publication:
    # Une seule publication pour les deux fichiers (pas de course entre deux
    # tâches qui créeraient chacune la page). L'installateur Windows est
    # publié même si l'AppImage n'a pas pu être construite.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.installateur.result == 'success'
    needs: [installateur, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: publication

      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publication/Mes-outils-Setup/Mes-outils-Setup.exe
            publication/Mes-outils-AppImage/Mes-outils-x86_64.AppImage
          fail_on_unmatched_files: false
          generate_release_notes: true
