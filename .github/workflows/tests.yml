# Tests unitaires de « Mes outils » sous Windows et sous Linux, à chaque envoi
# et à chaque demande de fusion.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paquets du système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtk8.6

      - name: Bibliothèques
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Tests
        run: python .github/rapport_tests.py
